services:
  # ---------------------------------------------
  # 1. Emergi-Sensei Backend (FastAPI API & Inference)
  # ---------------------------------------------
  - type: web
    name: emergi-sensei-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "git lfs install && git lfs pull && pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # ---------------------------------------------
  # 2. Emergi-Sensei Frontend (React + Vite SPA)
  # ---------------------------------------------
  - type: web
    name: emergi-sensei-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
