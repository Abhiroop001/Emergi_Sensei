services:
  - type: web
    name: emergi-sensei-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

